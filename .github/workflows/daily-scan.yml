name: Daily Headline Watcher

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily (07:00 Paris in summer)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Headline Watcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python headline_watcher.py

      - name: Commit result
        if: always()  # still commit usage.log / partial result on failure (keeps Actions alive)
        run: |
          git config user.name "news-scanner-bot"
          git config user.email "actions@github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Digest $(date -u +%F)"
          git push
