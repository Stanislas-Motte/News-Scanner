# --- Edit this file to control what Headline Watcher does ---

context_file: instructions.txt

headline_sources:
  # Global / Anglo
  - https://www.ft.com
  - https://www.wsj.com
  - https://www.bloomberg.com
  - https://www.reuters.com
  - https://www.economist.com

  # United States
  - https://www.nytimes.com/section/business
  - https://www.nytimes.com/section/climate
  - https://www.washingtonpost.com/politics/
  - https://www.cnbc.com

  # United Kingdom
  - https://www.bbc.com/news/business
  - https://www.theguardian.com/uk/business
  - https://www.thetimes.co.uk

  # European Union / Europe
  - https://www.politico.eu
  - https://www.handelsblatt.com
  - https://www.lesechos.fr
  - https://www.ilsole24ore.com
  - https://elpais.com/economia/

email:
  to:
    - motte.stanislas@gmail.com
  from: "News Scanner <onboarding@resend.dev>"
  subject_prefix: "Headline Watcher"

model: claude-haiku-4-5
max_tokens: 800

# Tool budgets — tuned for <$1/run and <10 min
web_fetch_max_uses: 17
web_fetch_max_content_tokens: 4000
web_search_max_uses: 1

# Guardrails
max_cost_usd: 1.00
max_runtime_seconds: 540
api_timeout_seconds: 480
