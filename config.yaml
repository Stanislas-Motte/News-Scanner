# --- Edit this file to control what the scanner does ---

# The context/lens through which news is filtered and summarized.
# Edit the instructions in the plain-text file referenced below.
context_file: instructions.txt

sites:
  # --- Original ---
  - https://www.reuters.com/sustainability/climate-energy/
  - https://www.euractiv.com/sections/emissions-trading-scheme/
  - https://www.ft.com
  - https://www.bloomberg.com/green

  # --- Specialist carbon / commodity trade press (highest signal) ---
  - https://carbon-pulse.com/
  - https://ccarbon.info/
  - https://www.qcintel.com/carbon            # Quantum Commodity Intelligence
  - https://www.montelnews.com/
  - https://www.argusmedia.com/en/emissions
  - https://www.icis.com/explore/commodities/energy/carbon/
  - https://www.spglobal.com/commodityinsights/en   # Platts / Commodity Insights
  - https://www.opisnet.com/                  # OPIS (strong on LCFS/RIN/RFS)
  - https://carbonherald.com/

  # --- Major general / financial outlets with carbon desks ---
  - https://www.theguardian.com/environment/carbon-emissions
  - https://www.politico.eu/section/energy/
  - https://www.climatechangenews.com/        # Climate Home News
  - https://www.bnef.com/                      # BloombergNEF (research, gated)

  # --- Think tanks / advocacy / data (slower, but useful for mechanism & policy) ---
  - https://ember-energy.org/                  # rebranded from ember-climate.org
  - https://carbonmarketwatch.org/
  - https://icapcarbonaction.com/en/news       # ICAP — good for cross-system tracking

  # --- Primary / regulator sources (authoritative, no editorial lag) ---
  - https://climate.ec.europa.eu/news_en       # EU Commission DG CLIMA
  - https://ww2.arb.ca.gov/news                 # CARB (LCFS, CCA)
  - https://www.rggi.org/                       # RGGI


# Email settings
email:
  # Add one line per recipient. All recipients are visible to each other.
  to:
    - motte.stanislas@gmail.com
  from: "News Scanner <onboarding@resend.dev>"  # works without domain setup
  subject_prefix: "Daily Carbon Markets Digest"

# Claude model to use
model: claude-haiku-4-5
max_tokens: 2700

# Max number of web searches Claude may run per digest (broad / second-order
# topic coverage). Each one costs a per-search fee plus the tokens it pulls in.
web_search_max_uses: 15

# Max number of page fetches per digest. web_fetch reads a specific URL directly,
# so this is how Claude covers the listed sites one by one. Set above the number
# of sites to leave headroom for following article links. Higher = more coverage,
# more cost.
web_fetch_max_uses: 20