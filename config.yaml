# --- Edit this file to control what the scanner does ---

# The context/lens through which news is filtered and summarized
context: >
  I am interested in all major news that could have an impact on the price of carbon markets.
  Specifically, I am interested in the European Union Allowances, UK Carbon Allowances.
  Go through the news outlets mentioned one by one and scan for any news that directly mentions
  these markets and flag it or any news that could have a second order impact on these markets.
  For example any news related to the ousting of a prime minister or something massice politically could have a second order impact.
  
# Websites to scan
sites:
  - https://www.reuters.com/sustainability/climate-energy/
  - https://www.euractiv.com/sections/emissions-trading-scheme/
  - https://www.ft.com
  - https://www.bloomberg.com/green

# Email settings
email:
  to: motte.stanislas@gmail.com
  from: "News Scanner <onboarding@resend.dev>"  # works without domain setup
  subject_prefix: "Daily Carbon Markets Digest"

# Claude model to use
model: claude-sonnet-4-6
max_tokens: 4000