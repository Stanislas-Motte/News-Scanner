# --- Edit this file to control what Headline Watcher does ---

context_file: instructions.txt

headline_sources:
  # Global / Anglo (tier 1 — highest signal)
  - https://www.ft.com
  - https://www.wsj.com
  - https://www.bloomberg.com
  - https://www.reuters.com

  # United States
  - https://www.nytimes.com/section/business
  - https://www.washingtonpost.com/politics/
  - https://www.cnbc.com

  # United Kingdom
  - https://www.bbc.com/news/business
  - https://www.theguardian.com/uk/business

  # European Union / Europe
  - https://www.politico.eu
  - https://www.handelsblatt.com

  # Run tier-2 sources on alternate days or add back once stable:
  # - https://www.economist.com
  # - https://www.nytimes.com/section/climate
  # - https://www.thetimes.co.uk
  # - https://www.lesechos.fr
  # - https://www.ilsole24ore.com
  # - https://elpais.com/economia/

email:
  to:
    - motte.stanislas@gmail.com
  from: "News Scanner <onboarding@resend.dev>"
  subject_prefix: "Headline Watcher"

# Strategy:
#   "search" (default) — uses Anthropic's indexed results scoped to the outlet
#     domains above. Survives paywalls/anti-bot (FT, WSJ, Bloomberg) far better
#     than fetching pages directly. Recommended.
#   "fetch" — reads each section page directly (often blocked by paywalled sites).
strategy: search

model: claude-sonnet-4-6
max_tokens: 1000

# Cap SDK retries so a string of rate-limited attempts can't blow past the
# workflow's 10-minute timeout (each retry can take up to api_timeout_seconds).
max_retries: 1

# Search strategy (default) — older tool type avoids the code-execution path.
# Note: we do NOT restrict search to the outlet domains above, because most of
# them block Anthropic's crawler (allowed_domains would 400). Instead the prompt
# steers toward major outlets, and the blocklist below removes carbon trade press.
web_search_tool_type: web_search_20250305
web_search_max_uses: 8

# Keep specialist carbon trade press out of broad search results.
search_blocked_domains:
  - carbon-pulse.com
  - ccarbon.info
  - qcintel.com
  - montelnews.com
  - argusmedia.com
  - icis.com
  - opisnet.com
  - carbonherald.com
  - climatechangenews.com

# Fetch strategy (only used when strategy: fetch).
web_fetch_tool_type: web_fetch_20250910
web_fetch_max_uses: 11
web_fetch_max_content_tokens: 2500
source_batch_size: 4

# Guardrails
max_cost_usd: 1.00
max_runtime_seconds: 540
api_timeout_seconds: 240
